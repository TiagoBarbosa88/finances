<mat-toolbar color="primary" class="header-toolbar">
  <div class="header-container">
    <div class="header-left">
      <button mat-icon-button class="logo" (click)="navigateToHome()">
        <mat-icon>account_balance</mat-icon>
      </button>
      <a (click)="navigateToHome()" class="brand-name" style="cursor: pointer;">
        <span class="brand-text">Controle Financeiro</span>
      </a>
    </div>

    <div class="header-right" *ngIf="isAuthenticated">
      <ng-container *ngIf="showMainMenu">
        <nav class="nav-links">
          <a mat-button routerLink="/dashboard" routerLinkActive="active">
            <mat-icon>dashboard</mat-icon>
            <span>Dashboard</span>
          </a>
        </nav>

        <button mat-button [matMenuTriggerFor]="transactionMenu" class="menu-button">
          <mat-icon>add_circle</mat-icon>
          <span>Transações</span>
        </button>
        <mat-menu #transactionMenu="matMenu">
          <a mat-menu-item routerLink="/transaction/add">
            <mat-icon>add</mat-icon>
            <span>Nova Transação</span>
          </a>
          <a mat-menu-item routerLink="/summary" *ngIf="!isOnSummaryPage">
            <mat-icon>assessment</mat-icon>
            <span>Resumo</span>
          </a>
        </mat-menu>
      </ng-container>

      <button mat-button [matMenuTriggerFor]="userMenu" class="user-menu-button">
        <mat-icon>account_circle</mat-icon>
        <span>Minha Conta</span>
      </button>
      <mat-menu #userMenu="matMenu" class="user-menu">
        <a mat-menu-item routerLink="/profile">
          <mat-icon>person</mat-icon>
          <span>Perfil</span>
        </a>
        <a mat-menu-item routerLink="/settings">
          <mat-icon>settings</mat-icon>
          <span>Configurações</span>
        </a>
        <mat-divider></mat-divider>
        <button mat-menu-item (click)="onLogoutClick()">
          <mat-icon>logout</mat-icon>
          <span>Sair</span>
        </button>
      </mat-menu>

      <button mat-icon-button (click)="toggleDarkMode()" class="theme-toggle" matTooltip="Alternar tema">
        <mat-icon>{{ isDarkMode ? 'light_mode' : 'dark_mode' }}</mat-icon>
      </button>
    </div>
  </div>
</mat-toolbar>
